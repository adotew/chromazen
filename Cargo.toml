[package]
name = "Chromazen"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
egui = "0.34.1"
egui_extras = { version = "0.34.1", default-features = false, features = [
  "svg",
] }
egui-wgpu = { version = "0.34.1", features = ["winit"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
wgpu = "29.0.3"
winit = "0.30.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
egui-winit = { version = "0.34.1", default-features = false }
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
web-sys = { version = "0.3.83", features = [
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
atomic-write-file = "0.3.0"
directories = "6.0.0"
egui-winit = "0.34.1"
env_logger = "0.11"
open = "5.3.6"
pollster = "0.4"
rfd = "0.17.2"
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.19.3", default-features = false }
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Pointer",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = [
  "NSEvent",
  "NSView",
  "NSWindow",
  "block2",
] }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6.2"
rustix = { version = "1.1", features = ["event"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

[dev-dependencies]
tempfile = "3.27.0"
