name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - if: env.MACOS_SIGNING_IDENTITY != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
      - run: ./packaging/macos/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Chromazen-macos
          path: dist/Chromazen.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - run: Compress-Archive -Path target/release/Chromazen.exe -DestinationPath Chromazen-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Chromazen-windows
          path: Chromazen-windows-x64.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Chromazen-linux
          path: |
            dist/Chromazen-linux-x86_64.AppImage
            dist/Chromazen-linux-x86_64.tar.gz

  release:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        run: |
          version=$(awk -F'"' '/^version =/ { print $2; exit }' Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/download-artifact@v4
        with:
          pattern: "Chromazen-*"
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: (cd dist && sha256sum * > SHA256SUMS)
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
