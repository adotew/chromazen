<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <meta name="theme-color" content="#1c1d21" />
    <title>Chromazen</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #202126; }
      body { font-family: system-ui, sans-serif; }
      #chromazen-canvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; cursor: crosshair; }
      #loading { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; color: #ddd; background: #202126; }
      #loading.hidden { display: none; }
      #loading.error { color: #ffb4ab; padding: 2rem; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="chromazen-canvas"></canvas>
    <div id="loading">Loading Chromazen…</div>
    <script type="module">
      import init from "./pkg/chromazen.js";
      init().catch((error) => {
        const loading = document.querySelector("#loading");
        loading.className = "error";
        loading.textContent = `Could not start Chromazen: ${error}`;
        console.error(error);
      });
    </script>
  </body>
</html>
